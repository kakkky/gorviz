# daemon 型: ノードごとに 1 つ。自分のノードの Pod のうち、annotation gorviz/pprof-port を付けた Pod だけを観測する
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gorviz-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gorviz-agent
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gorviz-agent
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: gorviz-agent}
subjects:
  - {kind: ServiceAccount, name: gorviz-agent, namespace: default}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gorviz-agent
spec:
  selector:
    matchLabels: {app: gorviz-agent}
  template:
    metadata:
      labels: {app: gorviz-agent}
    spec:
      serviceAccountName: gorviz-agent
      containers:
        - name: gorviz-agent
          image: ghcr.io/kakkky/gorviz:latest
          command: ["gorviz-agent"]
          env:
            - {name: GORVIZ_AGENT_MODE, value: daemon}
            - name: GORVIZ_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: GORVIZ_SERVER_ADDR, value: "gorviz-server:7071"}
            - name: GORVIZ_TOKEN
              valueFrom: {secretKeyRef: {name: gorviz, key: token}}
            # server が自分で作った CA のハッシュ。server の起動ログの ca_sha256
            - {name: GORVIZ_CA_FINGERPRINT, value: "<ca_sha256>"}
          volumeMounts:
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
          resources:
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: pods
          hostPath: {path: /var/log/pods}
---
# 観測してほしい Pod の例。annotation は Deployment ではなく Pod のテンプレートに書く
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: checkout}
  template:
    metadata:
      labels: {app.kubernetes.io/name: checkout} # サービスの名前になる
      annotations:
        gorviz/pprof-port: "6060" # agent はこの Pod の IP とこのポートで pprof に取りに行く
        gorviz/log-container: app # stdout / stderr をログとして取るコンテナ
    spec:
      containers:
        - name: app
          image: example.com/checkout:latest
          ports:
            - containerPort: 6060
