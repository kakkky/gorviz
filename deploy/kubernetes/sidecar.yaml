# sidecar 型: アプリと同じ Pod に置く。ログはアプリと共有するボリュームのファイルから読む
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: example.com/api:latest
          # pprof は localhost だけに公開する (agent は同じ Pod から読む)。ログは共有ボリュームにも書く
          env:
            - {name: PPROF_ADDR, value: "localhost:6060"}
            - {name: LOG_FILE, value: /var/log/app/app.log}
          volumeMounts:
            - {name: logs, mountPath: /var/log/app}
        - name: gorviz-agent
          image: ghcr.io/kakkky/gorviz:latest
          command: ["gorviz-agent"]
          env:
            - {name: GORVIZ_AGENT_MODE, value: sidecar}
            - {name: GORVIZ_SERVICE, value: api}
            - name: GORVIZ_INSTANCE
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: GORVIZ_PPROF_ADDR, value: "localhost:6060"}
            - {name: GORVIZ_LOG_FILES, value: "/var/log/app/*.log"}
            - {name: GORVIZ_SERVER_ADDR, value: "gorviz-server:7071"}
            - name: GORVIZ_TOKEN
              valueFrom: {secretKeyRef: {name: gorviz, key: token}}
            - {name: GORVIZ_CA_FINGERPRINT, value: "<ca_sha256>"}
            - {name: GORVIZ_BUFFER_BYTES, value: "67108864"} # つながらない間に持っておく上限 (64MiB)
          volumeMounts:
            - {name: logs, mountPath: /var/log/app, readOnly: true}
          resources:
            limits: {cpu: 200m, memory: 160Mi}
      volumes:
        - name: logs
          emptyDir: {}
