# sidecar 型 (Cloud Run): アプリと同じサービスに gorviz-agent を並べる。gcloud run services replace service.yaml で反映する
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api
spec:
  template:
    metadata:
      annotations:
        # 既定ではリクエストを処理していない間は CPU がほぼ割り当てられず、agent の trace の取得と server への送信が止まる
        run.googleapis.com/cpu-throttling: "false"
        # agent はアプリの pprof を読むので、アプリの後に起動する
        run.googleapis.com/container-dependencies: '{"gorviz-agent":["api"]}'
        # gorviz-server (GKE か GCE) へ VPC の中を通ってつなぐ
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containers:
        - name: api
          image: example.com/api:latest
          ports:
            - containerPort: 8080
          # pprof は localhost だけに公開する (agent は同じインスタンスから読む)。ログは共有ボリュームにも書く
          env:
            - {name: PPROF_ADDR, value: "localhost:6060"}
            - {name: LOG_FILE, value: /var/log/app/app.log}
          volumeMounts:
            - {name: logs, mountPath: /var/log/app}
        - name: gorviz-agent
          image: ghcr.io/kakkky/gorviz:latest
          command: ["gorviz-agent"]
          env:
            - {name: GORVIZ_AGENT_MODE, value: sidecar}
            - {name: GORVIZ_SERVICE, value: api}
            - {name: GORVIZ_PPROF_ADDR, value: "localhost:6060"}
            # アプリと共有するボリューム (in-memory) のファイルから読む
            - {name: GORVIZ_LOG_FILES, value: "/var/log/app/*.log"}
            - {name: GORVIZ_SERVER_ADDR, value: "10.0.0.10:7071"}
            - {name: GORVIZ_CA_FINGERPRINT, value: "<ca_sha256>"}
            - name: GORVIZ_TOKEN
              valueFrom: {secretKeyRef: {name: gorviz-token, key: latest}}
          volumeMounts:
            - {name: logs, mountPath: /var/log/app}
          resources:
            limits: {cpu: "1", memory: 256Mi}
      volumes:
        - name: logs
          emptyDir: {medium: Memory}
