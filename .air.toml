# docker compose (compose.yaml) から使う。make launcher.up と同じ構成で、コンテナの外から見えるよう GUI と Todo アプリは 0.0.0.0 で待ち受ける
root = "."
tmp_dir = "bin/air"

[build]
  cmd = "templ generate && go build -o ./bin/air/gorviz-launcher ./cmd/launcher && go build -o ./bin/air/todo-app ./example/todo-app"
  full_bin = "exec ./docker/dev/run.sh"
  include_ext = ["go", "templ", "css", "js"]
  exclude_dir = ["bin", ".git", ".playwright-mcp", "docs", "deploy", "node_modules"]
  # templ generate が書く _templ.go で、もう一度作り直しが走らないようにする
  exclude_regex = ["_templ\\.go$", "_test\\.go$"]
  delay = 500
  # launcher と todo-app が Interrupt で止まるまで、強制終了の前に待つ
  send_interrupt = true
  kill_delay = "6s"

[log]
  main_only = true
