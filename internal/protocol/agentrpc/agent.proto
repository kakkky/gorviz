// agent と server の契約。agent は server へ TCP を 1 本張り、TLS の直後に Handshake を送ってから gRPC を流す。
// 時間の長さ (_ns) はチャンクの始まりからの経過時間か、長さそのもの
syntax = "proto3";

package gorviz.agentrpc.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kakkky/gorviz/internal/protocol/agentrpc";

service ObservationService {
  // Export はインスタンスごとの観測データをまとめて送り、server がインスタンスごとにどこまで持っているかを返す
  rpc Export(ExportRequest) returns (ExportResponse);
}

message Handshake {
  string agent_id = 1;
  string token = 2;
}

message ExportRequest {
  repeated Batch batches = 1;
}

message ExportResponse {
  repeated InstanceCursor cursors = 1;
}

message Instance {
  string service = 1;
  string name = 2;
  string incarnation = 3;
}

message Cursor {
  string log_agent = 1;
  uint64 log_seq = 2;
  google.protobuf.Timestamp trace_chunk = 3;
  google.protobuf.Timestamp snapshot = 4;
  google.protobuf.Timestamp leak_check = 5;
}

message InstanceCursor {
  Instance instance = 1;
  Cursor cursor = 2;
}

message Batch {
  Instance instance = 1;
  Cursor after = 2;
  repeated LogLine logs = 3;
  repeated TraceChunk trace_chunks = 4;
  repeated GoroutineSnapshot snapshots = 5;
  repeated GoroutineLeakCheck leak_checks = 6;
  bool ended = 7;
}

message LogLine {
  string agent = 1;
  uint64 seq = 2;
  google.protobuf.Timestamp at = 3;
  bool time_from_log = 4;
  string level = 5;
  string message = 6;
  string raw = 7;
  string source = 8;
  optional uint64 trace_seq = 9;
  optional int64 duration_ns = 10;
}

message Frame {
  string function = 1;
  string file = 2;
  int64 line = 3;
}

message GoroutineSnapshot {
  google.protobuf.Timestamp at = 1;
  repeated Goroutine goroutines = 2;
}

message Goroutine {
  int64 id = 1;
  string state = 2;
  string wait_reason = 3;
  bool wait_reason_inferred = 4;
  int64 waiting_ns = 5;
  bool waiting_lower_bound = 6;
  string entry = 7;
  Frame current = 8;
  Frame created_by = 9;
  bool created_by_inferred = 10;
  repeated Frame stack = 11;
  int64 woken_by = 12;
  Frame woken_by_at = 13;
}

message GoroutineLeakCheck {
  google.protobuf.Timestamp at = 1;
  string status = 2;
  repeated LeakedStack leaks = 3;
}

message LeakedStack {
  repeated Frame stack = 1;
  int64 count = 2;
}

message TraceChunk {
  google.protobuf.Timestamp started_at = 1;
  int64 duration_ns = 2;
  repeated StateChange events = 3;
  repeated ProcLane procs = 4;
  map<int64, string> entries = 5;
  repeated GCRange gc = 6;
  repeated HeapSample heap = 7;
  repeated GCEnd gc_ends = 8;
  int64 goroutines_created = 9;
  int64 goroutines_destroyed = 10;
  int64 gc_cycles = 11;
  int64 threads = 12;
  repeated LogMark log_marks = 13;
  TraceStats stats = 14;
}

message StateChange {
  int64 at_ns = 1;
  string kind = 2;
  int64 goroutine = 3;
  Place place = 4;
  string function = 5;
  string location = 6;
  bool created = 7;
  int64 woken_by = 8;
  string woken_by_function = 9;
  string woken_by_location = 10;
  int64 proc = 11;
  string proc_status = 12;
  int64 thread = 13;
}

message Place {
  string kind = 1;
  int64 proc = 2;
  bool has_proc = 3;
  int64 thread = 4;
  string reason = 5;
  bool cgo = 6;
}

message ProcLane {
  int64 proc = 1;
  repeated ProcSpan spans = 2;
}

message ProcSpan {
  int64 goroutine = 1;
  int64 thread = 2;
  int64 start_ns = 3;
  int64 end_ns = 4;
}

message GCRange {
  string kind = 1;
  int64 goroutine = 2;
  string reason = 3;
  int64 start_ns = 4;
  int64 end_ns = 5;
}

message HeapSample {
  int64 at_ns = 1;
  uint64 objects_bytes = 2;
  uint64 goal_bytes = 3;
}

message GCEnd {
  int64 at_ns = 1;
  uint64 live_heap_bytes = 2;
  uint64 heap_goal_bytes = 3;
}

message LogMark {
  uint64 seq = 1;
  int64 goroutine = 2;
  int64 at_ns = 3;
}

message TraceStats {
  int64 procs = 1;
  int64 runnable_ns = 2;
  repeated WaitSite waits = 3;
  Histogram sched_latency = 4;
  Histogram stw = 5;
  double gc_max_share = 6;
  int64 proc_running_ns = 7;
  int64 proc_gc_ns = 8;
}

message WaitSite {
  string kind = 1;
  string reason = 2;
  bool cgo = 3;
  string entry = 4;
  string function = 5;
  string location = 6;
  int64 count = 7;
  int64 total_ns = 8;
  int64 max_ns = 9;
}

message Histogram {
  repeated uint64 counts = 1;
  int64 max_ns = 2;
}
