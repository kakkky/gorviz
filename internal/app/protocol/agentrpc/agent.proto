// agent と server の間の口。接続はどちらも agent から server へ外向きに張り、張った直後に Hello (1 行の JSON) を送ってから gRPC を流す。
//   - push の接続: agent が呼び出し側で、server の Ingest を呼ぶ
//   - pull の接続: 向きを逆にして server が呼び出し側になり、agent の Agent を呼ぶ
// 時間の長さ (_ns) は区切りの先頭からの経過時間か、長さそのもの。時刻は Timestamp で、ないときは送らない
syntax = "proto3";

package gorviz.agentrpc.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/kakkky/gorviz/internal/app/protocol/agentrpc";

service Ingest {
  // Push は軽いもの (ログ・goroutine dump) を送る。agent が数秒ごとに呼ぶ
  rpc Push(PushRequest) returns (google.protobuf.Empty);
}

// Agent は server が必要なときだけ trace を求める口。持っているものを返すだけで、判定はしない
service Agent {
  // LatestChunk は最新の区切りを、生の trace を除いて返す。if_newer_than より新しい区切りがなければ not_modified を返し、同じ区切りを何度も運ばない
  rpc LatestChunk(LatestChunkRequest) returns (ChunkReply);
  // ChunkAt は at を含む区切りを、生の trace を除いて返す
  rpc ChunkAt(ChunkAtRequest) returns (ChunkReply);
  // ChunksBetween は保存に使うので、生の trace ごと区切りを 1 つずつ流す
  rpc ChunksBetween(ChunksBetweenRequest) returns (stream TraceChunk);
  rpc FindLogMark(FindLogMarkRequest) returns (FindLogMarkReply);
  rpc Span(google.protobuf.Empty) returns (SpanReply);
}

// PushRequest は前に送ったものから変わっていないものを送らない
message PushRequest {
  repeated LogLine logs = 1;
  GoroutineDump dump = 2;
}

message LatestChunkRequest {
  google.protobuf.Timestamp if_newer_than = 1;
}

message ChunkAtRequest {
  google.protobuf.Timestamp at = 1;
}

// ChunkReply の chunk がなければ、まだ区切りがない
message ChunkReply {
  TraceChunk chunk = 1;
  bool not_modified = 2;
}

message ChunksBetweenRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

message FindLogMarkRequest {
  uint64 seq = 1;
}

// FindLogMarkReply の chunk がなければ見つからなかった。chunk は生の trace を除く
message FindLogMarkReply {
  TraceChunk chunk = 1;
  TraceLogMark mark = 2;
}

// SpanReply の span がなければ、まだ何も録っていない
message SpanReply {
  RecordingSpan span = 1;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARN = 3;
  LOG_LEVEL_ERROR = 4;
}

message LogLine {
  int64 id = 1;
  google.protobuf.Timestamp at = 2;
  bool time_from_log = 3;
  LogLevel level = 4;
  string message = 5;
  string raw = 6;
  string source = 7;
  optional uint64 trace_seq = 8;
  optional int64 duration_ns = 9;
}

enum LeakCheckStatus {
  LEAK_CHECK_STATUS_UNSPECIFIED = 0;
  LEAK_CHECK_STATUS_DONE = 1;
  LEAK_CHECK_STATUS_SKIPPED = 2;
  LEAK_CHECK_STATUS_UNSUPPORTED = 3;
  LEAK_CHECK_STATUS_DISABLED = 4;
}

message GoroutineDump {
  google.protobuf.Timestamp at = 1;
  repeated Goroutine goroutines = 2;
  LeakCheckStatus leak_check = 3;
}

message Goroutine {
  int64 id = 1;
  string state = 2;
  int64 wait_ns = 3;
  string entry_function = 4;
  string current_function = 5;
  string created_by = 6;
  string created_at = 7;
  bool leaked = 8;
  map<string, string> labels = 9;
}

message TraceChunk {
  google.protobuf.Timestamp started_at = 1;
  SchedulerTimeline timeline = 2;
  repeated TraceLogMark log_marks = 3;
  TraceStats stats = 4;
  bytes raw = 5;
}

message TraceLogMark {
  uint64 seq = 1;
  int64 goroutine = 2;
  int64 at_ns = 3;
}

message SchedulerTimeline {
  int64 window_ns = 1;
  repeated ProcLane procs = 2;
  repeated int64 threads = 3;
  int64 goroutines_created = 4;
  int64 goroutines_destroyed = 5;
  repeated SchedEvent events = 6;
  reserved 7;
  reserved "events_truncated";
  map<int64, string> entries = 8;
  repeated GCRange gc = 9;
  repeated HeapSample heap = 10;
  int64 gc_cycles = 11;
  repeated GCEnd gc_ends = 12;
}

message ProcLane {
  int64 proc = 1;
  repeated SchedSpan spans = 2;
}

message SchedSpan {
  int64 goroutine = 1;
  int64 thread = 2;
  int64 start_ns = 3;
  int64 end_ns = 4;
}

enum SchedEventKind {
  SCHED_EVENT_KIND_UNSPECIFIED = 0;
  SCHED_EVENT_KIND_GOROUTINE = 1;
  SCHED_EVENT_KIND_PROC = 2;
}

enum ProcStatus {
  PROC_STATUS_UNSPECIFIED = 0;
  PROC_STATUS_IDLE = 1;
  PROC_STATUS_RUNNING = 2;
}

message SchedEvent {
  int64 at_ns = 1;
  SchedEventKind kind = 2;
  int64 goroutine = 3;
  GoroutinePlace place = 4;
  string function = 5;
  string location = 6;
  bool created = 7;
  int64 woken_by = 8;
  string woken_by_function = 9;
  string woken_by_location = 10;
  int64 proc = 11;
  ProcStatus proc_status = 12;
  int64 thread = 13;
}

enum GoroutinePlaceKind {
  GOROUTINE_PLACE_KIND_UNSPECIFIED = 0;
  GOROUTINE_PLACE_KIND_RUNNING = 1;
  GOROUTINE_PLACE_KIND_LOCAL_RUN_QUEUE = 2;
  GOROUTINE_PLACE_KIND_GLOBAL_RUN_QUEUE = 3;
  GOROUTINE_PLACE_KIND_WAITING = 4;
  GOROUTINE_PLACE_KIND_SYSCALL = 5;
  GOROUTINE_PLACE_KIND_DEAD = 6;
}

message GoroutinePlace {
  GoroutinePlaceKind kind = 1;
  int64 proc = 2;
  bool has_proc = 3;
  int64 thread = 4;
  string reason = 5;
  bool cgo = 6;
}

enum GCRangeKind {
  GC_RANGE_KIND_UNSPECIFIED = 0;
  GC_RANGE_KIND_STOP_THE_WORLD = 1;
  GC_RANGE_KIND_MARK_ASSIST = 2;
  GC_RANGE_KIND_MARK = 3;
}

message GCRange {
  GCRangeKind kind = 1;
  int64 goroutine = 2;
  string reason = 3;
  int64 start_ns = 4;
  int64 end_ns = 5;
}

message HeapSample {
  int64 at_ns = 1;
  uint64 objects_bytes = 2;
  uint64 goal_bytes = 3;
}

message GCEnd {
  int64 at_ns = 1;
  uint64 live_heap_bytes = 2;
  uint64 heap_goal_bytes = 3;
}

message TraceStats {
  int64 window_ns = 1;
  int64 procs = 2;
  int64 runnable_ns = 3;
  repeated WaitSite waits = 4;
  Histogram sched_latency = 5;
  Histogram stw = 6;
  double gc_max_share = 7;
  int64 proc_running_ns = 8;
  int64 proc_gc_ns = 9;
}

message WaitSite {
  GoroutinePlaceKind kind = 1;
  string reason = 2;
  bool cgo = 3;
  string entry = 4;
  string function = 5;
  string location = 6;
  int64 count = 7;
  int64 total_ns = 8;
  int64 max_ns = 9;
}

message Histogram {
  repeated uint64 counts = 1;
  int64 max_ns = 2;
}

message RecordingSpan {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  int64 bytes = 3;
  int64 limit_bytes = 4;
}
